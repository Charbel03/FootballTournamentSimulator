<section class="team-count-page">
  <div class="team-count-container">
    <header class="team-count-header">
      <h1>Select Number of Teams</h1>
      <p>Choose how many teams should participate in the tournament</p>
    </header>

    <div class="team-count-grid">
      <article
        class="team-count-card"
        *ngFor="let option of teamOptions"
      >
        <h2>{{ option.label }}</h2>
        <p>Select {{ option.label.toLowerCase() }} to continue setting up your tournament.</p>

        <button
          type="button"
          class="card-button"
          (click)="selectTeamCount(option.value)"
        >
          Select
        </button>
      </article>
    </div>

    <button type="button" class="back-button" (click)="back()">Go back</button>
  </div>
</section>
